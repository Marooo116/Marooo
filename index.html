<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marooo | Shoutcaster & Production Director</title>
<meta name="description" content="Marooo — Mobile Legends shoutcaster and esports production director in the Philippines. Showreels, past events, rates and booking.">
<meta property="og:title" content="Marooo | Shoutcaster & Production Director">
<meta property="og:description" content="Marooo — Mobile Legends shoutcaster and esports production director in the Philippines. Showreels, past events, rates and booking.">
<meta property="og:type" content="website">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" id="font-link" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>

<style id="app-css">
/* Layout: broadcast-agency one-pager. "Band" sections (intro, caster and director title cards, contact) carry reels and stats; "paper" sections hold work, credits, rates, gallery and FAQ on a hairline grid. Five styles re-map the band/paper tokens; five font sets re-map the type tokens. */
:root{
  --bg:#F6F2ED; --bg-2:#EEE7DF; --surface:#FFFFFF; --fg:#17110F; --fg-2:#5B4A42; --line:#E2D8CE; --ph:#EDE5DC;
  --band:#17110F; --band-2:#221A17; --band-3:#2E2420; --band-fg:#F6F2ED; --band-fg-2:#C9B9AE; --band-line:#3A2D28;
  --accent:#B4501C; --on-accent:#FFFFFF; --accent-hi:#E8946A;
  --accent-text:var(--accent); --band-accent:var(--accent-hi); --band-btn:var(--accent); --band-btn-fg:var(--on-accent);
  --f-display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --d-stretch:110%; --d-case:none; --d-weight:800; --d-track:-0.03em;
  color-scheme: light;
}
:root[data-style="light"]{
  --bg:#FAFAF8; --bg-2:#F1F0EC; --surface:#FFFFFF; --fg:#141414; --fg-2:#55524C; --line:#E4E2DC; --ph:#ECEAE4;
  --band:#F1F0EC; --band-2:#FFFFFF; --band-3:#FAFAF8; --band-fg:#141414; --band-fg-2:#55524C; --band-line:#D9D6CF;
  --band-accent:var(--accent);
}
:root[data-style="night"]{
  --bg:#0F1218; --bg-2:#141821; --surface:#171C25; --fg:#EEF1F6; --fg-2:#A7B0BF; --line:#262D3A; --ph:#1D2330;
  --band:#08090D; --band-2:#131720; --band-3:#1A1F2B; --band-fg:#EEF1F6; --band-fg-2:#A7B0BF; --band-line:#252B37;
  --accent-text:var(--accent-hi); color-scheme: dark;
}
:root[data-style="gold"]{
  --bg:#F4EFE4; --bg-2:#EAE2D0; --surface:#FFFDF8; --fg:#12100C; --fg-2:#5A5345; --line:#DED5C2; --ph:#E8DFCB;
  --band:#0E0D0B; --band-2:#1A1814; --band-3:#24211B; --band-fg:#F4EFE4; --band-fg-2:#C2B9A6; --band-line:#34302A;
}
:root[data-style="bold"]{
  --bg:#FFFFFF; --bg-2:#F3F3F1; --surface:#FFFFFF; --fg:#111111; --fg-2:#555555; --line:#E3E3E0; --ph:#EEEEEC;
  --band:var(--accent); --band-fg:var(--on-accent);
  --band-2:color-mix(in srgb, var(--on-accent) 12%, var(--accent)); --band-3:color-mix(in srgb, var(--on-accent) 20%, var(--accent));
  --band-fg-2:color-mix(in srgb, var(--on-accent) 78%, var(--accent)); --band-line:color-mix(in srgb, var(--on-accent) 30%, var(--accent));
  --band-accent:var(--on-accent); --band-btn:#111111; --band-btn-fg:#FFFFFF;
}
:root[data-style="executive"]{
  --bg:#F7F6F2; --bg-2:#EEECE6; --surface:#FFFFFF; --fg:#0F1A2B; --fg-2:#4A5568; --line:#DEDBD3; --ph:#E8E5DD;
  --band:#0F1A2B; --band-2:#172539; --band-3:#1F3048; --band-fg:#F7F6F2; --band-fg-2:#B7C0CE; --band-line:#2A3A52;
  --accent-text:#7A5F33;
}
:root[data-style="minimal"]{
  --bg:#FFFFFF; --bg-2:#F5F5F5; --surface:#FFFFFF; --fg:#0A0A0A; --fg-2:#525252; --line:#E5E5E5; --ph:#F0F0F0;
  --band:#0A0A0A; --band-2:#171717; --band-3:#262626; --band-fg:#FAFAFA; --band-fg-2:#A3A3A3; --band-line:#2E2E2E;
  --band-accent:#A3A3A3; --band-btn:#FAFAFA; --band-btn-fg:#0A0A0A;
}
:root[data-style="slate"]{
  --bg:#F4F5F7; --bg-2:#EAECEF; --surface:#FFFFFF; --fg:#111418; --fg-2:#4B5563; --line:#DDE1E6; --ph:#E6E9ED;
  --band:#1C2128; --band-2:#252B34; --band-3:#2F3640; --band-fg:#F4F5F7; --band-fg-2:#AEB6C2; --band-line:#363E49;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app{overflow-x:clip;background:var(--bg);color:var(--fg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.band{background:var(--band);color:var(--band-fg)}
.label{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.band .label{color:var(--band-accent)}
.big{font-stretch:var(--d-stretch);text-transform:var(--d-case);font-weight:var(--d-weight);letter-spacing:var(--d-track)}
.h2{font-size:clamp(28px,3.4vw,44px);line-height:1.08}
.sec{padding-block:96px}
.sec + .sec{padding-top:0}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:40px;max-width:760px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:6px;font-family:var(--f-body);font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,filter .15s}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.band .btn-accent{background:var(--band-btn);color:var(--band-btn-fg)}
.btn-accent:hover{filter:brightness(1.1)}
.btn-ghost{border-color:var(--band-line);color:var(--band-fg)}
.btn-ghost:hover{border-color:var(--band-fg-2)}
.btn-outline{border-color:var(--fg);color:var(--fg);background:transparent}
.btn-outline:hover{background:var(--fg);color:var(--bg)}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--fg-2);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;background:var(--ph)}
.cover{width:100%;height:100%;object-fit:cover;display:block}

/* nav */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;border-bottom:1px solid var(--band-line)}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-mark{width:38px;height:38px;border-radius:8px;background:var(--band-btn);color:var(--band-btn-fg);display:grid;place-items:center}
.logo-txt{display:flex;flex-direction:column;line-height:1.1}
.logo-name{font-family:var(--f-display);font-stretch:var(--d-stretch);text-transform:var(--d-case);font-weight:800;font-size:18px}
.logo-sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-fg-2)}
.nav nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 28px;font-size:14px;font-weight:500}
.nav nav a{color:var(--band-fg-2);text-decoration:none;padding-block:12px}
.nav nav a:hover{color:var(--band-fg)}
.nav nav .btn{color:var(--band-btn-fg);min-height:42px;padding:0 18px}

/* sticky top bar + phone bottom bar */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;border-bottom:1px solid var(--band-line)}
.topbar .nav{border-bottom:0;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:31;background:var(--band)}
.nav-links{display:flex;flex-wrap:wrap;gap:4px 28px}
.nav nav a[aria-current]{color:var(--band-fg);box-shadow:inset 0 -2px 0 var(--band-accent)}
.chapter,#about,#faq,#contact,#gallery{scroll-margin-top:72px}
.mbar{display:none}
@media (max-width:720px){
  .nav-links{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--band);border-top:1px solid var(--band-line);padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));gap:6px}
  .mbar a{flex:1 1 0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px;text-decoration:none;color:var(--band-fg-2);font-size:12px;font-weight:600}
  .mbar a[aria-current]{color:var(--band-fg);background:var(--band-2)}
  .mbar a.mbar-book{background:var(--band-btn);color:var(--band-btn-fg)}
  #app{padding-bottom:calc(66px + env(safe-area-inset-bottom, 0px))}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
}

/* intro */
.hero{display:flex;flex-wrap:wrap;gap:64px;align-items:flex-end;padding-block:96px 104px}
.hero-copy{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.hero h1{font-size:clamp(40px,5.6vw,76px);line-height:1}
.band h1 em,.band h2 em{font-style:normal;color:var(--band-accent)}
.intro{font-size:19px;line-height:1.65;color:var(--band-fg-2);max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.avail{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;border:1px solid var(--band-line);background:var(--band-2);border-radius:999px;padding:8px 14px}
.adot{width:9px;height:9px;border-radius:50%;background:#2E9E5B;box-shadow:0 0 0 4px rgba(46,158,91,.22)}
.avail-limited .adot{background:#D99A1E;box-shadow:0 0 0 4px rgba(217,154,30,.22)}
.avail-booked .adot{background:#C2412D;box-shadow:0 0 0 4px rgba(194,65,45,.22)}
.doors{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px}
.door{display:flex;align-items:center;gap:18px;background:var(--band-2);border:1px solid var(--band-line);color:var(--band-fg);text-decoration:none;border-radius:10px;padding:22px;transition:border-color .2s,background .2s}
.door:hover{border-color:var(--band-accent);background:var(--band-3)}
.door-icon{flex:0 0 52px;height:52px;border-radius:8px;background:var(--band-btn);color:var(--band-btn-fg);display:grid;place-items:center}
.door-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.door-title{font-family:var(--f-display);font-stretch:var(--d-stretch);text-transform:var(--d-case);font-weight:700;font-size:22px;line-height:1.15}
.door-stat{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--band-fg-2)}
.door-go{flex:0 0 40px;height:40px;border-radius:50%;border:1px solid var(--band-line);display:grid;place-items:center;font-size:18px;color:var(--band-accent)}

/* events strip + partners */
.credits{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 22px;padding-block:28px;border-bottom:1px solid var(--line)}
.credits .label{margin-right:8px}
.credits .c{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--fg-2)}
.credits .sep{color:var(--line)}
.partners{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.partner{min-height:96px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.partner img{max-height:52px;max-width:100%;width:auto;object-fit:contain;filter:grayscale(1);opacity:.85;transition:filter .2s,opacity .2s}
.partner:hover img{filter:none;opacity:1}
.partner span{font-family:var(--f-display);font-weight:650;font-size:16px;color:var(--fg-2)}

/* chapter */
.ch-head{display:flex;flex-wrap:wrap;gap:64px;align-items:center;padding-block:96px 64px}
.ch-copy{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:22px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--band-line);border-radius:999px;padding:8px 14px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--band-accent)}
.ch-role{font-size:15px;color:var(--band-fg-2)}
.ch-title{font-size:clamp(34px,4.6vw,62px);line-height:1.02}
.ch-media{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:12px}
.reel{display:block;aspect-ratio:16/9;max-width:100%;border-radius:10px;border:1px solid var(--band-line);background:var(--band-2);position:relative;overflow:hidden;text-decoration:none;color:var(--band-fg-2)}
.reel .ph{position:absolute;inset:0;background:var(--band-2);color:var(--band-fg-2);align-items:flex-end;padding-bottom:22px}
.reel img{position:absolute;inset:0}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .2s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
a.reel:hover .play{transform:translate(-50%,-50%) scale(1.06)}
.reel .tag,.clip .tag{position:absolute;top:14px;left:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;background:rgba(17,17,17,.8);color:#fff;padding:6px 10px;border-radius:4px;z-index:1}
.reel-cap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--band-fg-2)}
.reel-cap b{color:var(--band-fg);font-weight:500}
.ch-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--band-line);padding-block:36px 80px;gap:24px 0}
.stat{display:flex;flex-direction:column;gap:6px;padding-inline:24px;border-left:1px solid var(--band-line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{font-family:var(--f-display);font-stretch:var(--d-stretch);font-weight:750;font-size:clamp(32px,3.4vw,44px);line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-fg-2)}

/* work */
.clips{display:flex;flex-direction:column;gap:20px}
.clips-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--fg);transition:border-color .2s,box-shadow .2s}
a.clip:hover{border-color:var(--fg-2);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.clip .thumb{aspect-ratio:16/9;max-width:100%;position:relative;background:var(--ph)}
.clip .thumb .ph{position:absolute;inset:0}
.clip .mini-play{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.clip .body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px}
.clip .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.clip h3{font-weight:650;font-size:18px;line-height:1.3}
.clip .meta{font-size:14px;color:var(--fg-2)}
.clip.featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.clip.featured .body{padding:40px;justify-content:center;gap:12px}
.clip.featured h3{font-size:clamp(22px,2.4vw,30px);line-height:1.2;font-weight:750;text-transform:var(--d-case)}

/* events table */
.events{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--line)}
.events li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 32px;padding-block:20px;border-top:1px solid var(--line)}
.yr{flex:0 0 72px;font-family:var(--f-mono);font-size:13px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.ev-name{flex:1 1 280px;min-width:0;font-family:var(--f-display);font-weight:650;font-size:19px}
.ev-role{font-size:15px;color:var(--fg-2)}

.ev-count{display:inline-block;vertical-align:middle;font-family:var(--f-mono);font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--accent-text);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-left:6px}
.more-ev summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:10px;margin-top:20px;min-height:44px;padding:0 18px;border:1px solid var(--fg);border-radius:6px;font-weight:600;font-size:15px}
.more-ev summary::-webkit-details-marker{display:none}
.more-ev summary::after{content:"+";font-size:18px}
.more-ev[open] summary::after{content:"–"}
.more-ev[open] summary{margin-bottom:8px}
.more-ev .events{border-bottom:1px solid var(--line)}

/* toolkit */
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}
.kit-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px}
.handles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.handles li{display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.45}
.tick{flex:0 0 22px;height:22px;margin-top:1px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:6px;font-family:var(--f-mono);font-size:13px}

/* services */
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:12px}
.svc.top{border:2px solid var(--accent);padding:27px}
.svc .flag{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent-text)}
.svc h3{font-weight:700;font-size:20px;line-height:1.25}
.svc p{font-size:15px;line-height:1.6;color:var(--fg-2);flex:1 1 auto}
.svc .price{flex:0 0 auto;font-family:var(--f-display);font-weight:650;font-size:16px;color:var(--fg);border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.svc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:28px;color:var(--fg-2);font-size:15px}

/* about + gallery */
.about-band{background:var(--bg-2)}
.about{display:flex;flex-wrap:wrap;gap:72px;align-items:center}
.portrait{flex:1 1 320px;min-width:0;max-width:440px;display:flex;flex-direction:column;gap:12px}
.portrait .frame{aspect-ratio:4/5;max-width:100%;border-radius:12px;overflow:hidden;background:var(--ph)}
.portrait .frame .ph{height:100%}
.caption{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--fg-2)}
.about-copy{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:22px}
.story{font-size:18px;line-height:1.75;max-width:36em}
.pull{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.45;max-width:30em;padding-top:22px;border-top:1px solid var(--line)}
.pull::before{content:"“";color:var(--accent-text);font-weight:800}
.pull::after{content:"”";color:var(--accent-text);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:10px}
.gallery .shot{aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--ph)}
.gallery .shot .ph{height:100%}
.gallery figcaption{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--fg-2)}

/* testimonials + faq */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px 56px}
.quote{margin:0;border-top:2px solid var(--fg);padding-top:28px;display:flex;flex-direction:column;gap:20px}
.quote blockquote{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(19px,1.8vw,23px);line-height:1.45}
.quote figcaption{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.quote figcaption b{color:var(--fg);font-weight:500}
.faq{border-bottom:1px solid var(--line);max-width:860px}
.faq details{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding-block:22px;font-family:var(--f-display);font-weight:650;font-size:19px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:0 0 32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-body);font-weight:500;font-size:20px;color:var(--accent-text)}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:24px;color:var(--fg-2);font-size:17px;line-height:1.7;max-width:44em}

/* contact */
.contact{display:flex;flex-wrap:wrap;gap:56px;padding-block:104px 72px;align-items:flex-end}
.contact-main{flex:2 1 480px;min-width:0;display:flex;flex-direction:column;gap:20px}
.contact h2{font-size:clamp(36px,5vw,66px);line-height:1}
.contact-main > p{font-size:18px;line-height:1.6;color:var(--band-fg-2);max-width:32em}
.contact-side{flex:1 1 340px;min-width:0;background:var(--band-2);border:1px solid var(--band-line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px}
.contact-side .label{color:var(--band-fg-2)}
.email{font-family:var(--f-display);font-weight:650;font-size:clamp(18px,2vw,22px);overflow-wrap:anywhere;user-select:all}
.socials{display:flex;flex-wrap:wrap;gap:8px}
.socials a{text-decoration:none;border:1px solid var(--band-line);min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:6px;font-weight:600;font-size:14px}
.socials a:hover{border-color:var(--band-accent)}
.copy-note{font-size:14px;color:var(--band-accent);min-height:1.2em}
footer.foot{border-top:1px solid var(--band-line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:24px 32px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--band-fg-2)}

/* editor (always light) */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:40;background:#111;color:#fff;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:50;background:#fff;color:#17110F;box-shadow:-20px 0 60px rgba(0,0,0,.3);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);color-scheme:light;font-family:'Figtree',system-ui,sans-serif}
.dr-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px max(20px, env(safe-area-inset-right, 0px)) 16px 20px;border-bottom:1px solid #E6DFD7;background:#F8F5F1}
.dr-head h2{font-family:inherit;font-size:17px;font-weight:700;flex:1 1 auto;text-transform:none}
.dr-head .btn{min-height:44px;padding:0 18px;font-size:15px}
.btn-dark{background:#17110F;color:#fff}
.btn-line{background:transparent;border-color:#CDBFB2;color:#17110F}
.dr-status{flex-basis:100%;font-size:14px;color:#5B4A42;min-height:1.2em}
.dr-status.err{color:#9B1C1C;font-weight:700}
.dr-body{overflow-y:auto;padding:8px 20px calc(40px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:4px}
.dr-intro{font-size:14px;color:#5B4A42;padding:12px 0 4px}
.dr-sec{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A3D16;margin:20px 0 0;padding-top:12px}
.grp{border-bottom:1px solid #E6DFD7}
.grp summary{cursor:pointer;font-weight:700;font-size:15px;padding:16px 0}
.grp-in{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.f small{font-weight:400;color:#5B4A42}
.f input[type=text],.f input[type=url],.f input[type=email],.f textarea{font:inherit;font-weight:400;font-size:16px;padding:11px 12px;border:1px solid #CDBFB2;border-radius:8px;background:#fff;color:#17110F;width:100%}
.f textarea{resize:vertical;min-height:88px}
.f input[data-relink]{font:inherit;font-weight:400;font-size:14px;padding:9px 12px;border:1px solid #CDBFB2;border-radius:8px;background:#fff;color:#17110F;width:100%}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.item{border:1px solid #E6DFD7;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#F8F5F1}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#5B4A42}
.item-head div{display:flex;gap:6px}
.mini{font:inherit;font-size:13px;font-weight:700;min-height:36px;padding:0 12px;border-radius:6px;border:1px solid #CDBFB2;background:#fff;color:#17110F;cursor:pointer}
.mini.danger{color:#9B1C1C;border-color:#E3B4B4}
.add{font:inherit;font-weight:700;font-size:14px;min-height:44px;border-radius:8px;border:1px dashed #B9A898;background:transparent;color:#17110F;cursor:pointer}
.imgf{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imgf .pv{width:96px;height:64px;border-radius:8px;background:#EDE5DC;overflow:hidden;display:grid;place-items:center;font-size:11px;color:#5B4A42;font-weight:500}
.imgf label.mini{display:inline-flex;align-items:center}
.imgf input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #CDBFB2;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #17110F}
.custom-color{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.custom-color input{width:44px;height:40px;border:1px solid #CDBFB2;border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.chk{flex-direction:row;align-items:center;gap:10px;font-weight:500;font-size:14px}
.chk input{width:20px;height:20px;flex:0 0 auto}
.chk.sub{padding-left:24px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card-btn{font:inherit;text-align:left;border:1px solid #CDBFB2;background:#fff;border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:#17110F}
.card-btn[aria-pressed="true"]{border:2px solid #17110F;padding:9px}
.card-btn b{font-size:14px}
.card-btn small{font-size:12px;color:#5B4A42;font-weight:400;line-height:1.35}
.pv-style{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid #E6DFD7}
.pv-style span{flex:1}
.pv-style span:last-child{flex:0 0 22%}
.pv-font{font-size:22px;line-height:1.1;font-weight:700}
.status-row{display:flex;flex-wrap:wrap;gap:8px}
.status-row button{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CDBFB2;background:#fff;color:#17110F;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.status-row button[aria-pressed="true"]{border:2px solid #17110F}

@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media (max-width:640px){.sec{padding-block:72px}.hero{padding-block:56px 72px;gap:40px}.ch-head{padding-block:72px 48px;gap:36px}.contact{padding-block:80px 56px}.stat{padding-inline:0;border-left:0}.ch-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px}.clip.featured .body{padding:24px}}

      '<div class="f"><span>Main color</span><div class="swatches">' +
      ACCENTS.map(function(a){ return '<button type="button" class="sw" data-accent="' + a[0] + '" aria-label="' + a[1] + '" aria-pressed="' + (state.accent === a[0]) + '" style="background:' + a[0] + '"></button>'; }).join('') +
      '<label class="custom-color" for="f-custom-accent"><input type="color" id="f-custom-accent" data-custom-accent value="' + esc(state.accent) + '">' + (custom ? 'Your color' : 'Pick any color') + '</label></div></div>' +
      '<div class="f"><span>Fonts</span><div class="cards">' +
      Object.keys(FONTSETS).map(function(k){ var F = FONTSETS[k]; return '<button type="button" class="card-btn" data-font="' + k + '" aria-pressed="' + (state.font === k) + '"><span class="pv-font" style="font-family:' + esc(F.d) + ',sans-serif;text-transform:' + F.cs + '">Aa Marooo</span><b>' + F.name + '</b><small>' + F.desc + '</small></button>'; }).join('') + '</div></div>';
  }
  function sectionsHTML(){
    return '<p class="dr-intro" style="padding:0">Hidden sections keep their info. Turn them back on anytime.</p>' + SECTIONS.map(function(s){
      return '<label class="f chk' + (s[2] ? ' sub' : '') + '"><input type="checkbox" id="f-show-' + s[0] + '" data-show="' + s[0] + '"' + (show(s[0]) ? ' checked' : '') + '>' + s[1] + '</label>';
    }).join('');
  }
  function statusHTML(){
    var cur = (state.availability || {}).status || 'open', colors = {open:'#2E9E5B', limited:'#D99A1E', booked:'#C2412D'};
    return '<div class="f"><span>Status</span><div class="status-row">' + Object.keys(STATUS).map(function(k){ return '<button type="button" data-status="' + k + '" aria-pressed="' + (cur === k) + '"><span style="width:9px;height:9px;border-radius:50%;background:' + colors[k] + '"></span>' + STATUS[k] + '</button>'; }).join('') + '</div></div>';
  }

  function field(f, base){
    var p = base ? base + '.' + f.path : f.path;
    if (f.t === 'look') return lookHTML();
    if (f.t === 'sections') return sectionsHTML();
    if (f.t === 'status') return statusHTML();
    if (f.t === 'row') return '<div class="row2">' + f.fields.map(function(x){ return field(x, base); }).join('') + '</div>';
    if (f.t === 'check') return '<label class="f chk"><input type="checkbox" id="' + fid(p) + '" data-check="' + p + '"' + (getPath(p) ? ' checked' : '') + '>' + f.label + '</label>';
    if (f.t === 'image'){
      var v = img(getPath(p));
      return '<div class="f"><span>' + f.label + '</span><div class="imgf"><div class="pv">' + (v ? '<img class="cover" src="' + v + '" alt="" style="object-fit:' + (f.png ? 'contain' : 'cover') + '">' : 'No image') + '</div>' +
        '<label class="mini" for="' + fid(p) + '">' + (v ? 'Change' : 'Upload') + '</label><input type="file" accept="image/*" id="' + fid(p) + '" data-img="' + p + '" data-max="' + (f.max || 1280) + '"' + (f.png ? ' data-png="1"' : '') + '>' +
        (v ? '<button type="button" class="mini danger" data-clear="' + p + '">Remove</button>' : '') + '</div>' +
        '<input type="url" id="' + fid(p) + '-link" data-path="' + p + '" data-relink="1" placeholder="or paste an image link (https://…)" value="' + (/^https:/i.test(getPath(p) || '') ? esc(getPath(p)) : '') + '"></div>';
    }
    var val = esc(getPath(p)), hint = f.hint ? ' <small>' + f.hint + '</small>' : '';
    if (f.t === 'textarea') return '<label class="f" for="' + fid(p) + '"><span>' + f.label + hint + '</span><textarea id="' + fid(p) + '" data-path="' + p + '" rows="3">' + val + '</textarea></label>';
    return '<label class="f" for="' + fid(p) + '"><span>' + f.label + hint + '</span><input type="' + (f.t === 'url' ? 'url' : f.t === 'email' ? 'email' : 'text') + '" id="' + fid(p) + '" data-path="' + p + '" value="' + val + '"' + (f.t === 'url' ? ' placeholder="https://"' : '') + '></label>';
  }

  function drawerHTML(open){
    open = open || {};
    var body = GROUPS.map(function(g, gi){
      var inner;
      if (g.list){
        var arr = getPath(g.list) || [];
        inner = (g.note ? '<p class="dr-intro" style="padding-top:0">' + g.note + '</p>' : '') + arr.map(function(_, i){
          var base = g.list + '.' + i;
          return '<div class="item"><div class="item-head"><span>' + g.item + ' ' + (i + 1) + '</span><div>' + (i > 0 ? '<button type="button" class="mini" data-up="' + base + '">Move up</button>' : '') +
            '<button type="button" class="mini danger" data-remove="' + base + '">Remove</button></div></div>' + g.fields.map(function(f){ return field(f, base); }).join('') + '</div>';
        }).join('') + (arr.length < g.max ? '<button type="button" class="add" data-add="' + gi + '">+ Add ' + g.item.toLowerCase() + '</button>' : '');
      } else inner = g.fields.map(function(f){ return field(f); }).join('');
      return (g.section ? '<h3 class="dr-sec">' + g.section + '</h3>' : '') + '<details class="grp" data-g="' + gi + '"' + (open[gi] ? ' open' : '') + '><summary>' + g.title + '</summary><div class="grp-in">' + inner + '</div></details>';
    }).join('');
    return '<div class="dr-head"><h2>Edit my info</h2><button type="button" class="btn btn-line" id="ed-cancel">Cancel</button><button type="button" class="btn btn-dark" id="ed-save">Save &amp; publish</button><p class="dr-status" id="ed-status" aria-live="polite"></p></div>' +
      '<div class="dr-body"><p class="dr-intro">Changes show on the page as you type, and the page scrolls to the part you open. Visitors see changes after you press Save &amp; publish.</p>' + body + '</div>';
  }

  var drawer = null;
  function openGroups(){ var o = {}; if (drawer) drawer.querySelectorAll('details[open]').forEach(function(d){ o[d.dataset.g] = 1; }); return o; }
  function redrawDrawer(){ if (!drawer) return; var o = openGroups(), sc = drawer.querySelector('.dr-body').scrollTop; drawer.innerHTML = drawerHTML(o); drawer.querySelector('.dr-body').scrollTop = sc; }
  function status(msg, err){ var s = document.getElementById('ed-status'); if (s){ s.textContent = msg; s.className = 'dr-status' + (err ? ' err' : ''); } }
  function changed(){ render(); try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch(e){} status(JSON.stringify(state) === savedJSON ? '' : 'Unsaved changes'); }

  function openEditor(){
    editing = true;
    drawer = document.createElement('aside'); drawer.className = 'drawer'; drawer.setAttribute('aria-label', 'Edit my info');
    drawer.innerHTML = drawerHTML({0:1});
    document.body.appendChild(drawer);
    render();
    try {
      var d = localStorage.getItem(DRAFT_KEY);
      if (d && d !== savedJSON){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'mini'; b.textContent = 'Restore unsaved changes'; b.id = 'ed-restore';
        var intro = drawer.querySelector('.dr-intro'); intro.appendChild(document.createElement('br')); intro.appendChild(b);
      }
    } catch(e){}
    drawer.addEventListener('input', onInput); drawer.addEventListener('change', onChange); drawer.addEventListener('click', onClick);
    drawer.querySelector('#ed-save').focus();
  }
  function closeEditor(){ editing = false; if (drawer){ drawer.remove(); drawer = null; } render(); var b = document.getElementById('open-editor'); if (b) b.focus(); }

  function onInput(e){
    var t = e.target;
    if (t.hasAttribute('data-custom-accent')){ if (/^#[0-9a-f]{6}$/i.test(t.value)){ state.accent = t.value; changed(); } return; }
    var p = t.dataset.path; if (!p) return; setPath(p, t.value); changed();
  }
  function onChange(e){
    var t = e.target;
    if (t.hasAttribute('data-custom-accent')){ redrawDrawer(); return; }
    if (t.dataset.show){ if (!state.hide) state.hide = {}; if (t.checked) delete state.hide[t.dataset.show]; else state.hide[t.dataset.show] = true; changed(); return; }
    if (t.dataset.check){ setPath(t.dataset.check, t.checked); changed(); return; }
    if (t.dataset.img && t.files && t.files[0]){
      var p = t.dataset.img; status('Adding image…');
      resize(t.files[0], +t.dataset.max || 1280, !!t.dataset.png).then(function(data){ setPath(p, data); redrawDrawer(); changed(); })
        .catch(function(){ status('That file could not be read as an image. Try a JPG or PNG.', true); });
    }
  }
  function onClick(e){
    var sm = e.target.closest('summary');
    if (sm){ var g0 = GROUPS[+sm.parentNode.dataset.g]; var target = g0 && (g0.anchor || (g0.view && LABELS[g0.view].id)); if (target && !sm.parentNode.open) goTo(target); return; }
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'ed-cancel'){ state = JSON.parse(savedJSON); try { localStorage.removeItem(DRAFT_KEY); } catch(x){} closeEditor(); return; }
    if (t.id === 'ed-save'){ save(); return; }
    if (t.id === 'ed-restore'){ try { state = migrate(JSON.parse(localStorage.getItem(DRAFT_KEY))); } catch(x){} redrawDrawer(); changed(); return; }
    if (t.dataset.style){ var st = STYLES.filter(function(s){ return s.id === t.dataset.style; })[0]; state.style = st.id; state.accent = st.accent; redrawDrawer(); changed(); return; }
    if (t.dataset.font){ state.font = t.dataset.font; redrawDrawer(); changed(); return; }
    if (t.dataset.accent){ state.accent = t.dataset.accent; redrawDrawer(); changed(); return; }
    if (t.dataset.status){ if (!state.availability) state.availability = {}; state.availability.status = t.dataset.status; redrawDrawer(); changed(); return; }
    if (t.dataset.clear){ setPath(t.dataset.clear, ''); redrawDrawer(); changed(); return; }
    if (t.dataset.add){ var g = GROUPS[+t.dataset.add]; setPath(g.list, (getPath(g.list) || []).concat([clone(g.blank)])); redrawDrawer(); changed(); return; }
    if (t.dataset.remove){ var r = splitIdx(t.dataset.remove); getPath(r[0]).splice(r[1], 1); redrawDrawer(); changed(); return; }
    if (t.dataset.up){ var u = splitIdx(t.dataset.up), a = getPath(u[0]), i = u[1], tmp = a[i - 1]; a[i - 1] = a[i]; a[i] = tmp; redrawDrawer(); changed(); return; }
  }

  function resize(file, max, png){
    return new Promise(function(res, rej){
      var r = new FileReader(); r.onerror = rej;
      r.onload = function(){
        var im = new Image(); im.onerror = rej;
        im.onload = function(){
          var s = Math.min(1, max / Math.max(im.width, im.height));
          var c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
          var ctx = c.getContext('2d');
          if (!png){ ctx.fillStyle = '#17110F'; ctx.fillRect(0, 0, c.width, c.height); }
          ctx.drawImage(im, 0, 0, c.width, c.height);
          res(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.8));
        };
        im.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function buildDoc(){
    var headStyle = document.head.querySelector('style');
    var reset = headStyle ? headStyle.textContent : ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    var named = state.casterName && !/^\[.*\]$/.test(state.casterName.trim()) ? state.casterName.trim() : 'Shoutcaster Portfolio';
    var data = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      '<title>' + esc(named) + '</title>' + META + '<link rel="stylesheet" id="font-link" href="' + fontHref(state.font) + '">' +
      '<style id="app-css">' + document.getElementById('app-css').textContent + '</style>' +
      '<div id="app"></div>' +
      '<script type="application/json" id="site-data">' + data + '<\/script>' +
      '<script id="app-js">' + document.getElementById('app-js').textContent + '<\/script>' +
      '</body></html>';
  }

  function save(){
    if (busy) return;
    if (!artifactNs){ status('Saving isn\'t available in this view. Open the page from your Claude account to save.', true); return; }
    var doc = buildDoc();
    if (doc.length > 7500000){ status('The page is too big to save. Remove a few gallery photos and try again.', true); return; }
    busy = true; status('Publishing…');
    artifactNs.publish(doc).then(function(){
      try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
      status('Published. Reloading…');
    }).catch(function(err){
      busy = false;
      var c = err && err.code;
      if (c === 'conflict') status('A newer version was saved somewhere else. The page is reloading to it; your typing is kept as unsaved changes.', true);
      else if (c === 'not_writer' || c === 'not_granted') status('You can view this page but not edit it.', true);
      else status('Couldn\'t publish. Check your connection and press Save again.', true);
    });
  }

  app.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'open-editor') openEditor();
    if (t.id === 'copy-email'){
      var note = document.getElementById('copy-note'), text = state.email || '';
      var done = function(){ note.textContent = 'Copied: ' + text; };
      var fallback = function(){ var r = document.createRange(); r.selectNodeContents(document.getElementById('email-text')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); note.textContent = 'Email selected. Copy it with your keyboard or long-press.'; };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch(x){ fallback(); }
    }
  });

  render();

  if (window.claude && window.claude.use){
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
      artifactNs = r[1];
      return r[0] ? r[0].canEdit() : false;
    }).then(function(ok){ canEdit = !!ok && !!artifactNs; if (canEdit) render(); }).catch(function(){});
  }
})();
</script>
</body>
</html>
